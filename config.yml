# quiet-cve 設定ファイル
#
# このファイルだけを編集すれば、トリアージの厳しさ・除外・通知先を調整できる。
# 迷ったら「しきい値を下げる」より「ignore に理由付きで書く」ほうが運用が壊れにくい。

version: 1

# ---------------------------------------------------------------------------
# scan: どこを、どう読むか
# ---------------------------------------------------------------------------
scan:
  # 親プロジェクトのルート。quiet-cve/ から見た相対パス。
  # 「既存プロジェクトに丸ごと置く」前提なので通常は ".." のままでよい。
  project_root: ".."

  # auto = 自動検出。特定のファイルだけ見たい場合はパスの配列で明示する。
  #   manifests:
  #     - package-lock.json
  #     - backend/requirements.txt
  manifests: auto

  # 自動検出時に降りていく最大ディレクトリ深さ
  max_depth: 6

  # devDependencies / require-dev / dev パッケージも対象にするか。
  # false でも「本番に出ないから影響なし」と即断はしない（SKILL.md のトリアージ規則参照）。
  include_dev_dependencies: true

  # ロックファイルに載らない資産（CDN 読み込み・手動配置されたライブラリ・
  # フォーク改造版）も走査するか。検知するのは Claude（SKILL.md Step 1b）で、
  # スクリプト単体では見ない。
  include_undeclared_assets: true

  # ミドルウェア・実行環境の照合（NVD CPE 経由。scripts/nvd_query.py が引く）。
  # 実行環境はリポジトリの外にあり、コードからバージョンを確実に検出できないため、
  # ここに明示的に宣言する。空なら何もしない。
  # 対応製品は `python3 scripts/nvd_query.py --list-products` で一覧できる。
  # API キーは不要（NVD_API_KEY 環境変数があればレート制限が緩む。機能は同じ）。
  middleware:
    # - name: nginx
    #   version: "1.18.0"
    # - name: openssl
    #   version: "1.1.1k"
    # - name: php
    #   version: "8.1.0"

# ---------------------------------------------------------------------------
# thresholds: 深刻度しきい値
# ---------------------------------------------------------------------------
thresholds:
  # コード上で「実際に使っている」と確認できた場合、この CVSS 以上は「要対応」
  act_cvss: 7.0

  # この CVSS 未満は、使用が確認できても既定では「様子見」止まり
  # （= レポートには載るが人間を叩き起こさない）
  watch_cvss: 4.0

  # この CVSS 未満は「影響なし」セクションに折りたたむ。0 にすると折りたたまない。
  noise_floor_cvss: 0.0

  # KEV（CISA 既知悪用脆弱性カタログ）掲載なら CVSS を問わず「要対応」に引き上げる。
  # アラート疲れ対策の要。ここを false にすると本フレームワークの意味が半減する。
  kev_always_act: true

  # CVSS スコアが取得できなかった場合の扱い: act | watch | ignore
  # 既定は watch（不明を握りつぶさない、でも叩き起こさない）
  unknown_severity: watch

# ---------------------------------------------------------------------------
# ignore: 意図的に無視するもの（必ず理由と期限を書く）
# ---------------------------------------------------------------------------
ignore:
  # 日付は必ず引用符付きで書く（"2026-12-31"）。
  # 期限切れ(expires < 実行日)の項目は無視されず、レポートに「除外期限切れ」として再浮上する。
  cves:
    # - id: CVE-2024-12345
    #   reason: "該当機能(XMLパーサ)を使っていない。2026-01-15 に手動確認済み"
    #   expires: "2026-12-31"

  # パッケージ単位の除外。ecosystem は npm | PyPI | Packagist
  packages:
    # - name: some-internal-fork
    #   ecosystem: npm
    #   reason: "社内フォーク。上流の CVE は適用されない"
    #   expires: "2026-12-31"

# ---------------------------------------------------------------------------
# exclude_paths: 依存ファイル検出・コード使用状況調査の両方で無視するパス
# ---------------------------------------------------------------------------
exclude_paths:
  - node_modules
  - vendor
  - .venv
  - venv
  - .git
  - dist
  - build
  - target
  - __pycache__
  - .tox
  - .next
  - coverage
  - quiet-cve

# ---------------------------------------------------------------------------
# triage: コード実使用判定の挙動
# ---------------------------------------------------------------------------
triage:
  # 親プロジェクトのコードを読んで「その脆弱な機能を実際に使っているか」を判定する。
  # false にすると CVSS + KEV だけの単純トリアージになる（= Dependabot 相当）。
  code_usage_check: true

  # 1 パッケージあたりに読むファイル数の上限（トークン消費の歯止め）
  max_files_per_package: 40

  # 「影響なし」と断定するために必要な根拠の数。
  # 1 にすると誤って握りつぶすリスクが上がる。
  min_evidence_for_not_affected: 2

  # 推移的依存（間接依存）をどう扱うか: same | downgrade
  #   same      = 直接依存と同じ基準
  #   downgrade = 実使用が確認できないかぎり「要対応」にしない
  transitive_policy: downgrade

# ---------------------------------------------------------------------------
# notify: 通知
# ---------------------------------------------------------------------------
notify:
  github_issue:
    enabled: false            # まずは false で運用を確認してから on にする
    require_confirmation: true  # 起票前に人間に確認を取る
    labels:
      - security
      - cve
    title_prefix: "[CVE]"
    # one_per_cve = CVE ごとに 1 issue / one_per_run = 実行ごとに 1 issue にまとめる
    granularity: one_per_cve
    assignees: []
    # 同じ CVE の open issue が既にあれば起票しない
    dedupe: true

# ---------------------------------------------------------------------------
# output: レポートとログの出力先
# ---------------------------------------------------------------------------
output:
  report_dir: reports
  log_file: logs/triage.jsonl
  # 同じ日に複数回実行したときレポートを上書きするか（false なら -2, -3 と連番）
  overwrite_same_day: false

  # --- 日次レポートの保持期間 ---------------------------------------------
  # この日数を過ぎた reports/YYYY-MM-DD.md は、月次サマリー
  # reports/monthly/YYYY-MM.md に集約してから削除する。
  #   0 または null → 無期限保持（集約も削除もしない）
  #
  # 削除して問題ない理由: 判断根拠を含む全レコードは logs/triage.jsonl に
  # 追記専用で残り続ける。日次レポートはあくまで人間向けの表示物。
  # 逆に言うと、ログに該当日の記録が無いレポートは削除されない（安全弁）。
  retention_days: 90

  # 月次サマリーの出力先。ここに置かれたファイルは削除対象にならない。
  monthly_dir: reports/monthly
